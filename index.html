<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Select Cascader with Tailwind CSS</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Font Awesome for icons (like the chevron) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="relative w-96">
        <!-- Text box with selected items -->
        <div id="selectBox" class="flex items-center w-full p-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div id="selectedItems" class="flex flex-wrap gap-2">
                <!-- Selected items will be dynamically added here -->
            </div>
            <span class="ml-auto text-gray-400"><i class="fas fa-chevron-down"></i></span>
        </div>

        <!-- Dropdown menu -->
        <div id="dropdown" class="absolute hidden w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg z-10">
            <ul class="p-2">
                <li class="flex items-center p-2 hover:bg-gray-100">
                    <input type="checkbox" id="light" value="Light" class="mr-2">
                    <label for="light">Light</label>
                </li>
                <li class="flex items-center p-2 hover:bg-gray-100">
                    <input type="checkbox" id="bamboo" value="Bamboo" class="mr-2">
                    <label for="bamboo">Bamboo</label>
                </li>
                <li class="flex items-center p-2 hover:bg-gray-100">
                    <input type="checkbox" id="energy" value="Energy" class="mr-2">
                    <label for="energy">Energy</label>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const selectBox = document.getElementById('selectBox');
        const dropdown = document.getElementById('dropdown');
        const selectedItems = document.getElementById('selectedItems');
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');

        // Toggle dropdown on click
        selectBox.addEventListener('click', () => {
            dropdown.classList.toggle('hidden');
        });

        // Handle checkbox selection
        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                updateSelectedItems();
            });
        });

        // Update selected items in the text box
        function updateSelectedItems() {
            selectedItems.innerHTML = ''; // Clear current tags
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    const tag = document.createElement('span');
                    tag.className = 'bg-gray-200 text-gray-700 px-2 py-1 rounded flex items-center';
                    tag.innerHTML = `${checkbox.value} <i class="fas fa-times ml-1 cursor-pointer"></i>`;
                    // Add click event to remove the tag
                    tag.querySelector('i').addEventListener('click', () => {
                        checkbox.checked = false;
                        updateSelectedItems();
                    });
                    selectedItems.appendChild(tag);
                }
            });
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!selectBox.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
